<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WBS Scheduler - Hourly Optimized with Late Status</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Inter, Arial, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            height: 100vh;
            overflow: hidden;
        }

        .app {
            display: grid;
            grid-template-columns: 380px 1fr;
            height: 100vh;
        }

        .sidebar {
            border-right: 1px solid #1e293b;
            padding: 20px;
            background: #111827;
            overflow: auto;
        }

        .title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 20px;
            line-height: 1.5;
            font-size: 13px;
        }

        textarea {
            width: 100%;
            height: 180px;
            background: #020617;
            color: #f8fafc;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 14px;
            font-family: monospace;
            font-size: 14px;
            resize: none;
        }

        .controls {
            margin-top: 16px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            background: #2563eb;
            color: white;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            background: #3b82f6;
        }

        button.secondary {
            background: #334155;
        }

        .speed-box {
            margin-top: 20px;
        }

        input[type=range] {
            width: 100%;
        }

        .legend {
            margin-top: 20px;
            display: grid;
            gap: 8px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #cbd5e1;
            font-size: 12px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .main {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .topbar {
            padding: 18px 24px;
            border-bottom: 1px solid #1e293b;
            background: #111827;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: bold;
        }

        .feasible {
            background: #064e3b;
            color: #6ee7b7;
        }

        .top-info {
            display: flex;
            gap: 30px;
            color: #cbd5e1;
        }

        .content {
            display: grid;
            grid-template-rows: 420px 1fr;
            overflow: hidden;
        }

        .timeline-area {
            padding: 24px;
            overflow: hidden;
            border-bottom: 1px solid #1e293b;
            position: relative;
        }

        .timeline-scroll {
            overflow: auto;
            width: 100%;
            height: 100%;
            position: relative;
        }

        .timeline-grid {
            min-width: 1200px;
            position: relative;
        }

        .timeline-header {
            display: grid;
            grid-template-columns: 160px repeat(var(--days), 64px);
            margin-bottom: 10px;
            position: sticky;
            top: 0;
            background: #0f172a;
            z-index: 10;
        }

        .day-cell {
            text-align: center;
            font-size: 11px;
            color: #94a3b8;
            padding: 4px;
            border-left: 1px solid #1e293b;
        }

        .task-row {
            display: grid;
            grid-template-columns: 160px repeat(var(--days), 64px);
            min-height: 50px;
            align-items: center;
            margin-bottom: 10px;
            position: relative;
        }

        .task-label {
            padding-right: 12px;
            position: sticky;
            left: 0;
            background: #0f172a;
            z-index: 5;
        }

        .task-card {
            background: #111827;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 6px;
            width: 148px;
        }

        .task-name {
            font-size: 13px;
            font-weight: 700;
        }

        .cell {
            border-left: 1px solid #1e293b;
            height: 100%;
            min-height: 50px;
        }

        /* STATUS BARS */
        .bar {
            position: absolute;
            top: 14px;
            height: 22px;
            border-radius: 6px;
            transition: width 0.3s;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bar.waiting {
            background: #475569;
            opacity: 0.5;
        }

        .bar.ready {
            background: #2563eb;
        }

        .bar.progress {
            background: #eab308;
        }

        .bar.done {
            background: #10b981;
        }

        .bar.late {
            background: #ef4444;
        }

        .progress-text {
            font-size: 10px;
            font-weight: 800;
            color: white;
        }

        .dev-layer {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 20;
            width: 100%;
            height: 100%;
        }

        .dev-token {
            position: absolute;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #38bdf8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 700;
            transition: all 0.4s ease;
            box-shadow: 0 0 8px rgba(56, 189, 248, .6);
            color: #000;
            border: 2px solid #fff;
        }

        .log-area {
            padding: 15px;
            overflow: auto;
            background: #020617;
            font-family: monospace;
            font-size: 12px;
            line-height: 1.6;
        }

        .log-day {
            color: #f8fafc;
            font-weight: bold;
            margin-top: 10px;
            border-top: 1px solid #334155;
            padding-top: 4px;
        }

        .log-assign {
            color: #60a5fa;
        }

        .log-work {
            color: #facc15;
        }

        .log-done {
            color: #4ade80;
        }

        .log-unlock {
            color: #c084fc;
        }

        .log-admit {
            color: #94a3b8;
            font-style: italic;
        }

        .progress-global {
            width: 200px;
            height: 8px;
            background: #1e293b;
            border-radius: 999px;
            overflow: hidden;
            margin-top: 6px;
        }

        .progress-global-bar {
            height: 100%;
            width: 0%;
            background: #22c55e;
            transition: 0.4s;
        }
    </style>
</head>

<body>
    <div class="app">
        <div class="sidebar">
            <div class="title">WBS Simulator</div>
            <div class="subtitle">Optimized Hourly + Late Status Restore.</div>
            <textarea id="input">
2025-01-06
2025-04-30
2 4
80 3 0
200 5 1 1
160 4 1 1
120 2 2 2 3</textarea>
            <div class="controls">
                <button id="runBtn">▶ Run</button>
                <button class="secondary" id="pauseBtn">⏸ Pause</button>
                <button class="secondary" id="resetBtn">↺ Reset</button>
            </div>
            <div class="speed-box">
                <input type="range" min="50" max="1500" value="300" id="speedSlider">
                <div style="margin-top:8px;color:#94a3b8; font-size: 12px;">Speed: <span id="speedText">300ms</span>
                </div>
            </div>
            <div class="legend">
                <div class="legend-item">
                    <div class="dot" style="background:#475569"></div> Waiting
                </div>
                <div class="legend-item">
                    <div class="dot" style="background:#2563eb"></div> Ready
                </div>
                <div class="legend-item">
                    <div class="dot" style="background:#eab308"></div> Progress
                </div>
                <div class="legend-item">
                    <div class="dot" style="background:#10b981"></div> Done
                </div>
                <div class="legend-item">
                    <div class="dot" style="background:#ef4444"></div> Late
                </div>
            </div>
        </div>

        <div class="main">
            <div class="topbar">
                <div>
                    <div class="status"
                        style="font-size: 18px; font-weight: bold; display: flex; align-items: center; gap: 10px;">
                        WBS Timeline <div class="status-badge feasible" id="statusBadge">IDLE</div>
                    </div>
                    <div class="progress-global">
                        <div class="progress-global-bar" id="globalBar"></div>
                    </div>
                </div>
                <div class="top-info">
                    <div>Day: <strong id="currentDay">-</strong></div>
                    <div>Done: <strong id="doneTasks">0</strong></div>
                    <div>Devs: <strong id="devCount">0</strong></div>
                </div>
            </div>
            <div class="content">
                <div class="timeline-area">
                    <div class="timeline-scroll">
                        <div class="timeline-grid" id="timelineGrid">
                            <div class="dev-layer" id="devLayer"></div>
                        </div>
                    </div>
                </div>
                <div class="log-area" id="logArea"></div>
            </div>
        </div>
    </div>

    <script>
        const CELL_WIDTH = 64;
        const LABEL_WIDTH = 160;
        let paused = false;
        let currentSimId = 0;

        class Task {
            constructor(id, effort, priority, deps) {
                this.id = id; this.total = effort; this.remaining = effort;
                this.priority = priority; this.deps = deps;
                this.children = []; this.indegree = deps.length;
                this.done = false; this.inProgress = false;
            }
        }

        function parseInput(text) {
            const lines = text.trim().split('\n').map(v => v.trim()).filter(Boolean);
            const startDate = new Date(lines[0]);
            const deadline = new Date(lines[1]);
            const [N, M] = lines[2].split(' ').map(Number);
            const tasks = {};
            for (let i = 1; i <= M; i++) {
                const parts = lines[2 + i].split(' ').map(Number);
                tasks[i] = new Task(i, parts[0], parts[1], parts.slice(3, 3 + parts[2]));
            }
            return { startDate, deadline, N, M, tasks };
        }

        function addDays(date, days) { const d = new Date(date); d.setDate(d.getDate() + days); return d; }
        function isWorkday(date) { const d = date.getDay(); return d >= 1 && d <= 5; }

        function generateSimulation(data) {
            const events = [];
            const tasks = JSON.parse(JSON.stringify(data.tasks));
            
            // Khởi tạo danh sách children cho từng task
            Object.values(tasks).forEach(t => t.children = []);
            Object.values(tasks).forEach(t => {
                t.deps.forEach(dId => {
                    if (tasks[dId]) tasks[dId].children.push(t.id);
                });
            });

            let currentDate = new Date(data.startDate);
            let dayIdx = 0;
            let totalDone = 0;
            
            let activeTasks = [];
            let readyList = [];
            
            // Nạp các task không có dependency vào hàng đợi ready ban đầu
            Object.values(tasks).forEach(t => {
                if (t.indegree === 0) readyList.push(t);
            });

            // Mảng lưu trạng thái phân bổ dev cho ngày hiện tại (0-indexed)
            let devTask = Array(data.N).fill(-1); 

            // Hàm so sánh thứ tự ưu tiên giống hệt C++ Max-heap:
            // Priority cao > Remaining lớn > ID nhỏ
            const compareTasks = (a, b) => {
                if (a.priority !== b.priority) return b.priority - a.priority;
                if (a.remaining !== b.remaining) return b.remaining - a.remaining;
                return a.id - b.id;
            };

            while (totalDone < data.M && dayIdx < 1000) {
                if (isWorkday(currentDate)) {
                    const dayStr = currentDate.toISOString().slice(0, 10);
                    events.push({ type: 'DAY', day: dayStr, dayIdx });

                    // ── Step 1: Admit các task ready mới vào pool active ──
                    readyList.sort(compareTasks);
                    readyList.forEach(t => {
                        if (!t.inProgress && !t.done) {
                            activeTasks.push(t);
                            t.inProgress = true;
                            events.push({ type: 'ADMIT', task: t.id });
                            events.push({ type: 'READY', task: t.id, dayIdx });
                        }
                    });
                    readyList = [];

                    // Sắp xếp lại danh sách active theo đúng độ ưu tiên
                    activeTasks.sort(compareTasks);

                    // ── Step 2: Phân bổ Dev (Gồm 2 lượt như C++) ──
                    devTask.fill(-1);
                    let devIdx = 0;
                    
                    // Pass 1: Mỗi active task lấy trước 1 dev (nếu còn dev)
                    for (let i = 0; i < activeTasks.length; i++) {
                        if (devIdx >= data.N) break;
                        devTask[devIdx] = activeTasks[i].id;
                        devIdx++;
                    }
                    
                    // Pass 2: Số dev rảnh còn lại dồn hết vào task có ưu tiên cao nhất
                    if (activeTasks.length > 0) {
                        while (devIdx < data.N) {
                            devTask[devIdx] = activeTasks[0].id;
                            devIdx++;
                        }
                    }

                    // Ghi nhận log phân bổ đầu ngày lên UI
                    for (let d = 0; d < data.N; d++) {
                        if (devTask[d] !== -1) {
                            events.push({ type: 'ASSIGN', dev: d + 1, task: devTask[d], dayIdx });
                        }
                    }

                    // ── Step 3: Tiến hành chạy số giờ làm việc (Hourly Pool) ──
                    let devHours = Array(data.N).fill(8); // Mỗi dev có 8 tiếng rảnh
                    let anyWorkDone = true;

                    while (anyWorkDone) {
                        anyWorkDone = false;
                        activeTasks.sort(compareTasks);

                        let anyDevsLeft = devHours.some(h => h > 0);
                        if (!anyDevsLeft || activeTasks.length === 0) break;

                        for (let i = 0; i < activeTasks.length; i++) {
                            let t = activeTasks[i];
                            if (t.done) continue;

                            // Gom các dev đang được gán cho task này và còn giờ làm việc
                            let myDevs = [];
                            for (let d = 0; d < data.N; d++) {
                                if (devTask[d] === t.id && devHours[d] > 0) {
                                    myDevs.push(d);
                                }
                            }
                            if (myDevs.length === 0) continue;

                            // Tính tổng số giờ tối đa mà nhóm dev này có thể cống hiến
                            let hoursAvail = 0;
                            myDevs.forEach(d => hoursAvail += devHours[d]);
                            let hoursGiven = Math.min(hoursAvail, t.remaining);

                            // Trừ giờ đều của các dev cho đến khi task đủ giờ hoặc dev hết giờ
                            let leftToGive = hoursGiven;
                            let totalContrib = 0;
                            for (let j = 0; j < myDevs.length; j++) {
                                let d = myDevs[j];
                                if (leftToGive <= 0) break;
                                let give = Math.min(devHours[d], leftToGive);
                                devHours[d] -= give;
                                leftToGive -= give;
                                totalContrib += give;
                            }

                            t.remaining -= totalContrib;
                            anyWorkDone = true;

                            events.push({
                                type: 'WORK',
                                task: t.id,
                                hours: totalContrib,
                                remaining: t.remaining,
                                progress: ((t.total - t.remaining) / t.total) * 100,
                                dayIdx
                            });

                            // Nếu task hoàn thành (Mid-day finish)
                            if (t.remaining === 0) {
                                t.done = true;
                                totalDone++;
                                events.push({ type: 'DONE', task: t.id, dayIdx, isLate: currentDate > data.deadline });

                                // Giảm indegree và unlock các task con
                                t.children.forEach(cId => {
                                    let child = tasks[cId];
                                    child.indegree--;
                                    if (child.indegree === 0) {
                                        readyList.push(child);
                                        events.push({ type: 'UNLOCK', task: cId });
                                    }
                                });

                                // Tìm task kế tiếp có ưu tiên cao nhất để tái phân bổ giờ thừa
                                let nextTask = activeTasks.find(candidate => !candidate.done) || null;
                                
                                // Kiểm tra cả các task vừa được unlock xem có cái nào ưu tiên hơn không
                                readyList.forEach(r => {
                                    if (!nextTask || compareTasks(r, nextTask) < 0) {
                                        nextTask = r;
                                    }
                                });

                                // Chuyển các dev đang dở việc sang task mới ngay lập tức
                                myDevs.forEach(d => {
                                    if (devHours[d] > 0) {
                                        if (nextTask) {
                                            devTask[d] = nextTask.id;
                                            events.push({ type: 'ASSIGN', dev: d + 1, task: nextTask.id, dayIdx });
                                        } else {
                                            devTask[d] = -1;
                                        }
                                    }
                                });

                                // Đưa task mới này vào hàng đợi active luôn nếu nó chưa ở đó
                                if (nextTask && !nextTask.inProgress) {
                                    nextTask.inProgress = true;
                                    if (!activeTasks.includes(nextTask)) {
                                        activeTasks.push(nextTask);
                                    }
                                    readyList = readyList.filter(r => r.id !== nextTask.id);
                                }
                            }
                        }

                        // Loại bỏ các task đã xong ra khỏi danh sách active giữa vòng lặp ngày
                        activeTasks = activeTasks.filter(t => !t.done);
                    }
                }
                currentDate = addDays(currentDate, 1);
                dayIdx++;
            }
            return { events, totalDays: dayIdx };
        }

        function buildTimeline(startDate, totalDays, tasks) {
            const grid = document.getElementById('timelineGrid');
            grid.style.setProperty('--days', totalDays);
            grid.innerHTML = '<div class="dev-layer" id="devLayer"></div>';
            const hMonth = document.createElement('div'), hDay = document.createElement('div');
            hMonth.className = hDay.className = 'timeline-header';
            hMonth.appendChild(document.createElement('div')); hDay.appendChild(document.createElement('div'));

            for (let i = 0; i < totalDays; i++) {
                const d = addDays(startDate, i);
                const mCell = document.createElement('div'), dCell = document.createElement('div');
                mCell.className = dCell.className = 'day-cell';
                if (d.getDate() === 1 || i === 0) mCell.innerHTML = `<b style="color:white">${d.toLocaleString('default', { month: 'short' })}</b>`;
                dCell.innerHTML = `<div>${d.getDate()}</div>`;
                if (!isWorkday(d)) dCell.style.background = '#1e293b';
                hMonth.appendChild(mCell); hDay.appendChild(dCell);
            }
            grid.appendChild(hMonth); grid.appendChild(hDay);
            Object.values(tasks).forEach(t => {
                const row = document.createElement('div'); row.className = 'task-row'; row.id = `task-row-${t.id}`;
                row.innerHTML = `<div class="task-label"><div class="task-card"><div class="task-name">Task ${t.id}</div></div></div>`;
                for (let i = 0; i < totalDays; i++) row.appendChild(document.createElement('div')).className = 'cell';
                grid.appendChild(row);
                updateTaskBar(t.id, 0, totalDays - 1, 'waiting', 0);
            });
        }

        function updateTaskBar(id, start, end, status, progress) {
            let bar = document.getElementById(`bar-${id}`);
            if (!bar) { bar = document.createElement('div'); bar.id = `bar-${id}`; document.getElementById(`task-row-${id}`).appendChild(bar); }
            bar.className = `bar ${status}`;
            bar.style.left = (LABEL_WIDTH + (start * CELL_WIDTH)) + 'px';
            bar.style.width = ((end - start + 1) * CELL_WIDTH) + 'px';
            bar.innerHTML = status === 'waiting' ? '' : `<div class="progress-text">${(status === 'done' || status === 'late') ? 'DONE' : Math.round(progress) + '%'}</div>`;
        }

        function addLog(text, cls) {
            const area = document.getElementById('logArea');
            const div = document.createElement('div'); div.className = cls; div.innerText = text;
            area.appendChild(div); area.scrollTop = area.scrollHeight;
        }

        async function runSimulation() {
            currentSimId++; const localId = currentSimId; paused = false;
            document.getElementById('pauseBtn').innerText = '⏸ Pause';
            const data = parseInput(document.getElementById('input').value);
            const sim = generateSimulation(data);
            buildTimeline(data.startDate, sim.totalDays, data.tasks);
            document.getElementById('logArea').innerHTML = ''; document.getElementById('statusBadge').innerText = 'RUNNING';

            let doneCount = 0, taskStartIdx = {}, dayDevs = {};
            for (let e of sim.events) {
                if (localId !== currentSimId) return;
                while (paused) { if (localId !== currentSimId) return; await new Promise(r => setTimeout(r, 100)); }

                if (e.type === 'DAY') {
                    document.getElementById('currentDay').innerText = e.day;
                    addLog(`=== Ngày ${e.day} ===`, 'log-day'); dayDevs = {};
                } else if (e.type === 'ADMIT') {
                    addLog(`[ADMIT] Task ${e.task} admitted to queue`, 'log-admit');
                } else if (e.type === 'READY') {
                    updateTaskBar(e.task, e.dayIdx, e.dayIdx, 'ready', 0);
                } else if (e.type === 'ASSIGN') {
                    if (!dayDevs[e.task]) dayDevs[e.task] = [];
                    if (!dayDevs[e.task].includes(e.dev)) {
                        dayDevs[e.task].push(e.dev);
                        let t = document.getElementById(`dev-${e.dev}`);
                        if (!t) { t = document.createElement('div'); t.id = `dev-${e.dev}`; t.className = 'dev-token'; t.innerText = e.dev; document.getElementById('devLayer').appendChild(t); }
                        const row = document.getElementById(`task-row-${e.task}`);
                        t.style.top = (row.offsetTop + 14) + 'px';
                        t.style.left = (LABEL_WIDTH + (e.dayIdx * CELL_WIDTH) + 10 + (dayDevs[e.task].length * 8)) + 'px';
                        addLog(`[ASSIGN] Dev ${e.dev} → Task ${e.task}`, 'log-assign');
                    }
                } else if (e.type === 'WORK') {
                    if (taskStartIdx[e.task] === undefined) taskStartIdx[e.task] = e.dayIdx;
                    updateTaskBar(e.task, taskStartIdx[e.task], e.dayIdx, 'progress', e.progress);
                    addLog(`[WORK] Task ${e.task}: ${e.hours}h | Còn lại: ${e.remaining}h`, 'log-work');
                } else if (e.type === 'DONE') {
                    doneCount++;
                    const finalStatus = e.isLate ? 'late' : 'done';
                    updateTaskBar(e.task, taskStartIdx[e.task], e.dayIdx, finalStatus, 100);
                    document.getElementById('doneTasks').innerText = doneCount;
                    document.getElementById('globalBar').style.width = (doneCount / data.M * 100) + '%';
                    addLog(`[DONE] Task ${e.task} hoàn thành ${e.isLate ? '(TRỄ)' : ''}`, 'log-done');
                } else if (e.type === 'UNLOCK') {
                    addLog(`[UNLOCK] Task ${e.task} is now ready`, 'log-unlock');
                }
                await new Promise(r => setTimeout(r, document.getElementById('speedSlider').value));
            }
            if (localId === currentSimId) document.getElementById('statusBadge').innerText = 'COMPLETED';
        }

        document.getElementById('runBtn').onclick = runSimulation;
        document.getElementById('pauseBtn').onclick = () => { paused = !paused; document.getElementById('pauseBtn').innerText = paused ? '▶ Resume' : '⏸ Pause'; };
        document.getElementById('resetBtn').onclick = () => location.reload();
        document.getElementById('speedSlider').oninput = (e) => { document.getElementById('speedText').innerText = e.target.value + 'ms'; };
    </script>
